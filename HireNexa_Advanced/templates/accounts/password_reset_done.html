{% extends "base.html" %}
{% block title %}Recovery Instructions Sent · HireNexa{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 60px auto;">
  <div style="background: #ffffff; border: 1px solid var(--slate-200); border-radius: var(--radius-xl); padding: 40px; text-align: center; box-shadow: var(--shadow-sm);">
    <div style="width: 54px; height: 54px; border-radius: 50%; background: var(--emerald-50); border: 2px solid var(--emerald-100); display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 18px; color: var(--emerald-600);">
      ✉️
    </div>
    <h1 style="font-size: 24px; font-weight: 800; color: var(--slate-900); margin: 0 0 10px 0;">Check Your Email</h1>
    <p style="font-size: 14px; color: var(--slate-600); line-height: 1.6; margin-bottom: 24px;">
      If an account exists with the email you entered, we have sent instructions for resetting your password.
    </p>
    <a href="{% url 'login' %}" class="btn btn-primary btn-md">
      Return to Sign In →
    </a>
  </div>
</div>
{% endblock %}
